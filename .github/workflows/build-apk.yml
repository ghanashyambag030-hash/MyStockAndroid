name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/mystock/app app/src/main/res/drawable app/src/main/res/values app/src/main/assets
          test -f index-3.html || { echo 'ERROR: index-3.html not found'; exit 1; }
          test -f app-icon.png || { echo 'ERROR: app-icon.png not found'; exit 1; }
          cp index-3.html app/src/main/assets/index-3.html
          cp app-icon.png app/src/main/res/drawable/app_icon.png

          cat > settings.gradle <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name='MyStockAndroid'
include ':app'
EOF

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > app/build.gradle <<'EOF'
plugins { id 'com.android.application' }

android {
    namespace 'com.mystock.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mystock.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.CAMERA" />
    <application
        android:allowBackup="true"
        android:label="My Stock"
        android:theme="@style/AppTheme"
        android:icon="@drawable/app_icon"
        android:usesCleartextTraffic="true">
        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:colorAccent">#2563eb</item>
        <item name="android:navigationBarColor">#000000</item>
        <item name="android:statusBarColor">#2563eb</item>
        <item name="android:windowLightStatusBar">false</item>
    </style>
</resources>
EOF

          cat > app/src/main/java/com/mystock/app/MainActivity.java <<'EOF'
package com.mystock.app;

import android.Manifest;
import android.app.Activity;
import android.content.ActivityNotFoundException;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.net.Uri;
import android.os.Bundle;
import android.provider.MediaStore;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.widget.Toast;

public class MainActivity extends Activity {
    private static final int FILE_CHOOSER_REQUEST = 1001;
    private static final int CAMERA_PERMISSION_REQUEST = 1002;
    private WebView webView;
    private ValueCallback<Uri[]> filePathCallback;
    private Uri cameraUri;
    private boolean pendingCameraCapture;

    @Override protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        webView = new WebView(this);
        setContentView(webView);
        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setAllowFileAccess(true);
        s.setAllowContentAccess(true);
        webView.setWebViewClient(new WebViewClient());
        webView.setWebChromeClient(new WebChromeClient() {
            @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                filePathCallback = callback;
                if (params.isCaptureEnabled()) openCamera(); else openGallery();
                return true;
            }
        });
        webView.loadUrl("file:///android_asset/index-3.html");
    }

    private void openCamera() {
        if (android.os.Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
            pendingCameraCapture = true;
            requestPermissions(new String[]{Manifest.permission.CAMERA}, CAMERA_PERMISSION_REQUEST);
        } else launchCamera();
    }

    private void launchCamera() {
        Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
        if (i.resolveActivity(getPackageManager()) == null) { toast("Camera app পাওয়া যায়নি।"); cancelChooser(); return; }
        try {
            android.content.ContentValues v = new android.content.ContentValues();
            v.put(MediaStore.Images.Media.DISPLAY_NAME, "mystock_scan_" + System.currentTimeMillis() + ".jpg");
            v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
            if (android.os.Build.VERSION.SDK_INT >= 29) v.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/My Stock");
            cameraUri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
            if (cameraUri == null) { toast("Camera image তৈরি করা যায়নি।"); cancelChooser(); return; }
            i.putExtra(MediaStore.EXTRA_OUTPUT, cameraUri);
            i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
            startActivityForResult(i, FILE_CHOOSER_REQUEST);
        } catch (Exception e) { toast("Camera চালু করা যায়নি।"); cancelChooser(); }
    }

    private void openGallery() {
        Intent i = new Intent(Intent.ACTION_GET_CONTENT);
        i.addCategory(Intent.CATEGORY_OPENABLE);
        i.setType("image/*");
        i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
        try {
            startActivityForResult(Intent.createChooser(i, "ছবি নির্বাচন করুন"), FILE_CHOOSER_REQUEST);
        } catch (ActivityNotFoundException e) {
            Intent f = new Intent(Intent.ACTION_OPEN_DOCUMENT);
            f.addCategory(Intent.CATEGORY_OPENABLE);
            f.setType("image/*");
            f.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
            try { startActivityForResult(f, FILE_CHOOSER_REQUEST); } catch (Exception ignored) { toast("Gallery/File picker পাওয়া যায়নি।"); cancelChooser(); }
        }
    }

    @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grants) {
        super.onRequestPermissionsResult(requestCode, permissions, grants);
        if (requestCode == CAMERA_PERMISSION_REQUEST) {
            if (grants.length > 0 && grants[0] == PackageManager.PERMISSION_GRANTED && pendingCameraCapture) {
                pendingCameraCapture = false;
                launchCamera();
            } else {
                pendingCameraCapture = false;
                toast("Camera permission না দিলে Camera ব্যবহার করা যাবে না।");
                cancelChooser();
            }
        }
    }

    @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (requestCode != FILE_CHOOSER_REQUEST || filePathCallback == null) return;
        Uri[] results = null;
        if (resultCode == RESULT_OK) {
            if (cameraUri != null) results = new Uri[]{cameraUri};
            else if (data != null) {
                if (data.getClipData() != null) {
                    int n = data.getClipData().getItemCount();
                    results = new Uri[n];
                    for (int j = 0; j < n; j++) results[j] = data.getClipData().getItemAt(j).getUri();
                } else if (data.getData() != null) results = new Uri[]{data.getData()};
            }
        }
        filePathCallback.onReceiveValue(results);
        filePathCallback = null;
        if (resultCode != RESULT_OK && cameraUri != null) try { getContentResolver().delete(cameraUri, null, null); } catch (Exception ignored) {}
        cameraUri = null;
    }

    private void cancelChooser() { if (filePathCallback != null) { filePathCallback.onReceiveValue(null); filePathCallback = null; } cameraUri = null; }
    private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }
    @Override public void onBackPressed() { if (webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
}
EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
